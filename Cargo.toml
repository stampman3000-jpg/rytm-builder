[package]
name = "rytm-builder"
version = "0.1.0"
edition = "2021"
description = "Compose a fresh Analog Rytm whole-project .syx from a dump library (builder, not editor)."
license = "MIT"

[lib]
name = "rytm_builder"
path = "src/lib.rs"

[[bin]]
name = "rytm-builder"
path = "src/main.rs"

[workspace]
members = ["src-tauri"]
resolver = "2"

[dependencies]
# rytm-sys pulls an unbound `home`; 0.5.12 needs edition2024 / newer rustc.
home = "=0.5.9"
md5 = "0.7"
rytm-sys = "0.1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

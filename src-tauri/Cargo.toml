[package]
name = "rytm-builder-app"
version = "0.1.0"
description = "Analog Rytm fresh project builder"
authors = ["Stampman3000"]
edition = "2021"
license = "MIT"

[lib]
name = "rytm_builder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rytm-builder = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
